name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    name: MCP smoke test
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile server
        run: python -m py_compile server.py tests/smoke_mcp.py tests/fixture_mcp.py

      - name: Run self-test
        run: python server.py --self-test

      - name: Run MCP stdio smoke test
        run: python tests/smoke_mcp.py

      - name: Run fixture tests
        run: python tests/fixture_mcp.py

      - name: Run MCP Doctor
        shell: pwsh
        run: .\mcp_doctor.ps1 -ConfigOut .\doctor.generated.json
