name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    name: MCP smoke test
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repo
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run Python test suite
        run: python tests/run_all.py --skip-powershell

      - name: Check PowerShell helpers
        shell: pwsh
        run: .\tests\check_powershell.ps1

      - name: Run MCP Doctor
        shell: pwsh
        run: .\mcp_doctor.ps1 -ConfigOut .\doctor.generated.json
